name: SalaryApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"
targets:
  SalaryApp:
    type: application
    platform: iOS
    sources: [SalaryApp]
    dependencies:
      - package: ZIPFoundation
    scheme:
      testTargets: [SalaryAppUITests]
    info:
      path: SalaryApp/Info.plist
      properties:
        CFBundleDisplayName: الرواتب
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSLocalNetworkUsageDescription: يُستخدم الاتصال بالشبكة المحلية لإرسال النسخة الاحتياطية إلى السيرفر الخاص.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSFaceIDUsageDescription: يُستخدم Face ID لقفل تطبيق الرواتب وحماية بيانات الموظفين.
        NSCameraUsageDescription: يُستخدم الماسح الضوئي لتصوير الكتب الرسمية وحفظها بصيغة PDF داخل التطبيق.
        UILaunchScreen:
          UIImageName: HomeLogo
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # مجلد التطبيق يظهر في تطبيق "الملفات": يمكن وضع ملفات الرواتب فيه واختيارها من هناك.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes: [processing]
        BGTaskSchedulerPermittedIdentifiers: [com.example.SalaryApp.periodicBackup]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.SalaryApp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SalaryAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SalaryAppUITests]
    dependencies:
      - target: SalaryApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.SalaryAppUITests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: SalaryApp
