<!doctype html><html lang='ar' dir='rtl'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><style>*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{font-family:system-ui;margin:0 auto;padding:32px 16px 56px;max-width:650px;background:#f5f7f8;color:#173a37;line-height:1.5;overflow-wrap:anywhere}h1{font-size:clamp(24px,7vw,32px);line-height:1.3;margin:0 0 18px}h2{font-size:clamp(20px,6vw,26px);line-height:1.3;margin:0 0 14px}p{margin:0 0 18px}section{background:white;padding:20px;border-radius:18px;margin:18px 0}ul{padding-right:22px}li{margin:8px 0}button,.file-choice{display:inline-block;padding:11px 18px;background:#13745e;color:white;border:0;border-radius:11px;font:inherit;font-size:16px;cursor:pointer;min-height:44px}button{margin-top:16px}.file-wrap{position:relative;display:inline-block}.file-input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.file-input:focus-visible+.file-choice{outline:3px solid #245ed9}.chosen{display:block;font-size:14px;color:#596968;margin:9px 0 16px}.check{display:flex;align-items:flex-start;gap:9px;font-size:15px}.check input{width:19px;height:19px;flex:none;margin:3px 0 0}@media(max-width:430px){section{padding:18px 16px}body{padding-top:40px}}</style><h1>مزامنة الرواتب</h1><p>مرحلة تجريبية: استخدم بيانات وهمية فقط حتى يكتمل ربط تطبيق الآيفون والتحقق من الخصوصية.</p><section><h2>الأشهر المنشورة</h2><ul><li>شهر تجريبي 2026 — 1 راتب، 0 استقطاع — إصدار 1</li></ul></section><section><h2>نشر شهر بعد مراجعته</h2><form action='publish' method='post' enctype='multipart/form-data'><span class='file-wrap'><input class='file-input' id='month-file' type='file' name='file' accept='.json,application/json' required><label class='file-choice' for='month-file'>اختيار ملف JSON</label></span><span class='chosen' id='chosen-file'>لم يُحدّد ملف</span><label class='check'><input type='checkbox' name='approved' value='yes' required> راجعت أعداد الشهر ومجاميعه</label><button type='submit'>نشر النسخة</button></form></section><section><h2>رمز جهاز قارئ</h2><form action='reader-token' method='post'><button type='submit'>إنشاء رمز جديد</button></form><p>يعرض الرمز مرة واحدة. احفظه في مدير كلمات مرور موثوق.</p></section><script>document.getElementById('month-file').addEventListener('change',function(){document.getElementById('chosen-file').textContent=this.files.length?this.files[0].name:'لم يُحدّد ملف'})</script></html>
