name: Desktop and Apple accounting compatibility
on: workflow_dispatch
permissions:
  contents: read
jobs:
  windows-export:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Validate and reopen a merged OneDrive workspace
        shell: bash
        run: |
          python windows/Checks/fixture.py "$RUNNER_TEMP/workspace-fixtures"
          (cd sync/workspace && PAYROLL_TEST_FIXTURES="$RUNNER_TEMP/workspace-fixtures" go test -run 'TestPortableRoundTrip|TestCancelledContractAndNewActiveBatchSameMonth')
          dotnet run --project windows/Checks -- --read-workspace "$RUNNER_TEMP/workspace-fixtures/merged-refunds.zip"
          dotnet run --project windows/Checks -- --read-contract-history "$RUNNER_TEMP/workspace-fixtures/merged-contract-history.zip" "$RUNNER_TEMP/workspace-fixtures/refunds.zip"
      - name: Open the OneDrive trial sign-in window in WebView2
        timeout-minutes: 4
        run: dotnet run --project windows/OneDriveTrialChecks -- "$env:RUNNER_TEMP/onedrive-trial-windows.png"
      - uses: actions/upload-artifact@v4
        with:
          name: onedrive-trial-windows-screen
          path: ${{ runner.temp }}/onedrive-trial-windows.png
      - name: Check device lock startup, rejection and background privacy
        timeout-minutes: 2
        run: dotnet run --project windows/DeviceLockChecks/DeviceLockChecks.csproj
      - name: Render a fictional payslip and verify scanned PDF pages
        run: dotnet run --project windows/DocumentChecks -- "$env:RUNNER_TEMP/refund-pdfs"
      - name: Verify accounting cycles and export the same inputs for Apple
        run: |
          python windows/Checks/fixture.py "$env:RUNNER_TEMP/accounting"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project windows/Checks -- --check-accounting-exchange "$env:RUNNER_TEMP/accounting"
      - name: Render the saved OneDrive trial refund and compare its files on Apple
        shell: bash
        run: |
          folder="$RUNNER_TEMP/accounting/exchange/trial"
          mkdir -p "$folder"
          export TRIAL_REFUND_SNAPSHOT="$folder/batch.json"
          node -e 'const fs=require("node:fs"),{makeRefund}=require("./SalaryApp/OneDriveTrial.js"); fs.writeFileSync(process.env.TRIAL_REFUND_SNAPSHOT,JSON.stringify(makeRefund("00000000-0000-4000-8000-000000000001","2026-11-27",[10000,30000]).snapshot))'
          dotnet run --project windows/Checks -- --check-refund-layout "$RUNNER_TEMP/refund-pdfs"
      - uses: actions/upload-artifact@v4
        with:
          name: accounting-exchange
          path: ${{ runner.temp }}/accounting/exchange
      - name: Export fictional payroll and edited preferences
        run: dotnet run --project windows/Checks/Payroll.Checks.csproj -- --write-preference-archive "$env:RUNNER_TEMP/windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: refund-letter-examples
          path: ${{ runner.temp }}/refund-pdfs
      - uses: actions/upload-artifact@v4
        with:
          name: windows-preferences
          path: ${{ runner.temp }}/windows.zip
  apple:
    needs: windows-export
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Verify stored identity used by the refund archive
        run: |
          swiftc -parse-as-library windows/Checks/apple_identity.swift -o "$RUNNER_TEMP/identity"
          "$RUNNER_TEMP/identity"
      - uses: actions/download-artifact@v4
        with:
          name: accounting-exchange
          path: ${{ runner.temp }}/exchange
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Reconstruct the Windows exchange with the OneDrive merger
        run: |
          mkdir "$RUNNER_TEMP/merged"
          cd sync/workspace
          PAYROLL_SOURCE_ARCHIVE="$RUNNER_TEMP/exchange/windows-month.zip" PAYROLL_RENDERED_ARCHIVE="$RUNNER_TEMP/merged/windows-month.zip" go test -run TestCrossPlatformAccountingExchange
      - name: Exercise the iPhone archive and letter reference implementations
        env:
          WINDOWS_EXCHANGE: ${{ runner.temp }}/merged/windows-month.zip
          TRIAL_REFUND_SNAPSHOT: ${{ runner.temp }}/exchange/trial/batch.json
          WINDOWS_REFUND: ${{ runner.temp }}/exchange/refund.json
        run: |
          python3 ci/compact_backup_test/run.py
          swiftc -frontend -parse SalaryApp/AppLock.swift SalaryApp/SettingsView.swift SalaryApp/HomeAccounting.swift SalaryApp/HomeDashboard.swift SalaryApp/EmployeeRefundView.swift SalaryApp/RefundHistoryView.swift
          python3 ci/employee_refund_test/run.py
          python3 ci/report_layout_test/run.py --preview-dir "$RUNNER_TEMP/apple-pages"
      - uses: actions/download-artifact@v4
        with:
          name: refund-letter-examples
          path: ${{ runner.temp }}/print-samples
      - name: Compare payroll PDF contents, row heights and table borders against Apple output
        run: |
          python3 -m venv "$RUNNER_TEMP/pdf-tools"
          "$RUNNER_TEMP/pdf-tools/bin/pip" install pymupdf==1.26.6
          "$RUNNER_TEMP/pdf-tools/bin/python" windows/Checks/general_reference.py "$RUNNER_TEMP/print-samples/general-report.pdf" "$RUNNER_TEMP/apple-pages/general-report-preview.pdf"
      - uses: actions/download-artifact@v4
        with:
          name: windows-preferences
          path: ${{ runner.temp }}
      - name: Restore on Apple and export edited preferences
        env:
          PREFERENCES_FROM_WINDOWS: ${{ runner.temp }}/windows.zip
          PREFERENCES_FOR_WINDOWS: ${{ runner.temp }}/apple.zip
        run: python3 ci/compact_backup_test/run.py
      - uses: actions/upload-artifact@v4
        with:
          name: apple-preferences
          path: ${{ runner.temp }}/apple.zip
  windows-restore:
    needs: apple
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: apple-preferences
          path: ${{ runner.temp }}
      - name: Restore Apple edits and verify balances
        run: dotnet run --project windows/Checks/Payroll.Checks.csproj -- --read-preference-archive "$env:RUNNER_TEMP/apple.zip"
