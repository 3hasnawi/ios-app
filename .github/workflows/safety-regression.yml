name: Application safety regression
on:
  workflow_dispatch:
    inputs:
      navigation_only:
        description: Recheck only system navigation and search context actions
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  logic:
    uses: ./.github/workflows/ios-logic-check.yml
  simulator:
    needs: logic
    uses: ./.github/workflows/simulator.yml
    with:
      quick: true
      safety_only: ${{ !inputs.navigation_only }}
      navigation_only: ${{ inputs.navigation_only }}
