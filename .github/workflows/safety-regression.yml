name: Application safety regression
# Recheck receipt accessibility grouping and press only inside the visible document.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/safety-regression.yml]
permissions:
  contents: write
jobs:
  logic:
    uses: ./.github/workflows/ios-logic-check.yml
  simulator:
    needs: logic
    uses: ./.github/workflows/simulator.yml
    with:
      quick: true
      navigation_only: true
