name: Application safety regression
# Recheck validated scan images and leave the leading screen edge for system back gestures.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/safety-regression.yml]
permissions:
  contents: write
jobs:
  logic:
    uses: ./.github/workflows/ios-logic-check.yml
  simulator:
    needs: logic
    uses: ./.github/workflows/simulator.yml
    with:
      quick: true
      safety_only: true
