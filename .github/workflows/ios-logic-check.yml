name: iOS logic checks (no app build)
'on':
  workflow_call:
  workflow_dispatch:
    inputs:
      large_backup:
        description: Test streaming a fictional JSONL larger than 2.3 GB
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  logic:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swiftc --version
      - name: Parse changed Swift files
        run: swiftc -frontend -parse SalaryApp/*.swift
      - name: Malformed Excel rejection
        run: python3 ci/import_safety_test/run.py
      - name: Interrupted restore recovery
        run: python3 ci/restore_safety_test/run.py
      - name: Retention and search normalization
        run: python3 ci/ios_safety_test/run.py
      - name: Health care summary
        run: python3 ci/health_summary_test/run.py
      - name: Payroll item parser
        run: bash ci/payroll_item_parser_test/run.sh
      - name: Report layout calculations
        run: python3 ci/report_layout_test/run.py
      - name: Excel report layout and numeric safety
        run: python3 ci/xlsx_layout_test/run.py
      - name: PDF page preservation
        run: python3 ci/pdf_safety_test/run.py
      - name: Treasury letter calculations
        run: bash ci/treasury_letter_test/run.sh
      - name: Streaming backup line reader
        run: |
          swiftc -O SalaryApp/BackupLineReader.swift ci/backup_line_reader_test/main.swift -o "$RUNNER_TEMP/backup-reader-test"
          "$RUNNER_TEMP/backup-reader-test"
      - name: Large fictional backup line reader
        if: ${{ inputs.large_backup }}
        timeout-minutes: 8
        run: '"$RUNNER_TEMP/backup-reader-test" --large'
