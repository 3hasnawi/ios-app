name: iOS logic checks (no app build)
'on':
  workflow_call:
  workflow_dispatch:
    inputs:
      large_backup:
        description: Test streaming a fictional JSONL larger than 2.3 GB
        type: boolean
        default: false
      report_preview:
        description: Render the fictional deduction PDF and PNG with production CoreText code
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  logic:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Persistent schema compatibility guard
        run: python3 ci/check_data_schema.py
      - name: Swift version
        run: swiftc --version
      - name: Parse changed Swift files
        run: swiftc -frontend -parse SalaryApp/*.swift
      - name: Pinned reports and legacy home choices
        run: |
          swiftc SalaryApp/HomePinnedReports.swift ci/home_pins_test/main.swift -o "$RUNNER_TEMP/home-pins-test"
          "$RUNNER_TEMP/home-pins-test"
      - name: Real SwiftData split import and rollback
        run: python3 ci/data_importer_test/run.py
      - name: All-month entity unification and interrupted rename recovery
        run: python3 ci/entity_rename_test/run.py
      - name: Deduction entity alerts and incomplete comparison safety
        run: python3 ci/deduction_entity_alert_test/run.py
      - name: Automatic all-field search and salary trust integration
        run: python3 ci/automatic_search_test/run.py
      - name: Device lock failure, cancellation and timeouts
        run: python3 ci/app_lock_test/run.py
      - name: Startup failure and concurrent callers
        run: python3 ci/startup_safety_test/run.py
      - name: Malformed Excel rejection
        run: python3 ci/import_safety_test/run.py
      - name: Excel-only salary trust and backup compatibility
        run: python3 ci/salary_trust_import_test/run.py
      - name: Interrupted restore recovery
        run: python3 ci/restore_safety_test/run.py
      - name: Retention and search normalization
        run: python3 ci/ios_safety_test/run.py
      - name: Health care summary
        run: python3 ci/health_summary_test/run.py
      - name: Payroll item parser
        run: bash ci/payroll_item_parser_test/run.sh
      - name: Report layout calculations
        run: |
          if [ "${{ inputs.report_preview }}" = "true" ]; then
            python3 ci/report_layout_test/run.py --preview-dir "$RUNNER_TEMP/deduction-style-preview"
          else
            python3 ci/report_layout_test/run.py
          fi
      - name: Upload fictional deduction preview
        if: ${{ inputs.report_preview }}
        uses: actions/upload-artifact@v4
        with:
          name: deduction-style-preview
          path: ${{ runner.temp }}/deduction-style-preview/
          retention-days: 7
      - name: Excel report layout and numeric safety
        run: python3 ci/xlsx_layout_test/run.py
      - name: PDF page preservation
        run: python3 ci/pdf_safety_test/run.py
      - name: Employee refund routing, documents and iPhone UI type check
        run: |
          if [ "${{ inputs.report_preview }}" = "true" ]; then
            export REFUND_PREVIEW_DIR="$RUNNER_TEMP/refund-letter-preview"
          fi
          python3 ci/employee_refund_test/run.py
      - name: Upload fictional refund letter preview
        if: ${{ inputs.report_preview }}
        uses: actions/upload-artifact@v4
        with:
          name: refund-letter-preview
          path: ${{ runner.temp }}/refund-letter-preview/
          retention-days: 7
      - name: Treasury letter calculations
        run: bash ci/treasury_letter_test/run.sh
      - name: Streaming backup line reader
        run: |
          swiftc -O SalaryApp/BackupLineReader.swift ci/backup_line_reader_test/main.swift -o "$RUNNER_TEMP/backup-reader-test"
          "$RUNNER_TEMP/backup-reader-test"
      - name: Large fictional backup line reader
        if: ${{ inputs.large_backup }}
        timeout-minutes: 8
        run: '"$RUNNER_TEMP/backup-reader-test" --large'
  compact-backup:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: SwiftData payroll archive migration and accounting round trip
        run: python3 ci/compact_backup_test/run.py
  interface-types:
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: weichsel/ZIPFoundation
          ref: e7048f0569f0ba37df26f8357f560b9d25e9a284
          path: vendor/ZIPFoundation
      - name: Type-check iPhone screens and navigation without building the application
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          FLAGS=(-swift-version 5 -target arm64-apple-ios26.0 -sdk "$SDK" -parse-as-library)
          xcrun swiftc "${FLAGS[@]}" -emit-module -module-name ZIPFoundation vendor/ZIPFoundation/Sources/ZIPFoundation/*.swift -emit-module-path "$RUNNER_TEMP/ZIPFoundation.swiftmodule"
          xcrun swiftc "${FLAGS[@]}" -I "$RUNNER_TEMP" -module-name SalaryApp -whole-module-optimization -typecheck SalaryApp/*.swift
