name: Simulator test

on:
  # البناء يدوي فقط (بأمر من صاحب المشروع)، لا يعمل تلقائياً عند الدمج.
  workflow_dispatch:
    inputs:
      quick:
        description: Focused navigation and visual regression check
        type: boolean
        default: false
      deductions_only:
        description: Recheck only the deduction comparison UI (use with quick)
        type: boolean
        default: false
      backup_only:
        description: Check account import and backup without navigation or sharing UI tests
        type: boolean
        default: false

permissions:
  contents: write   # لنشر الصور في فرع screenshots

jobs:
  simulator:
    runs-on: macos-26
    defaults:
      run:
        shell: bash
    env:
      BUNDLE: com.example.SalaryApp
      QUICK: ${{ inputs.quick }}
      DEDUCTIONS_ONLY: ${{ inputs.deductions_only }}
      BACKUP_ONLY: ${{ inputs.backup_only }}
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
          mkdir -p ci-output/screenshots

      - name: Pick iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import sys, json, re
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in devices if "iOS" in k),
                            key=lambda k: [int(x) for x in re.findall(r"\d+", k.split("iOS")[-1])])
          phones = [d for d in devices[runtimes[-1]] if d["name"].startswith("iPhone")]
          pro = [d for d in phones if "Pro" in d["name"] and "Max" not in d["name"]]
          d = (pro or phones)[0]
          print(d["udid"]); print(d["name"], runtimes[-1], file=sys.stderr)')
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build for simulator (app + navigation UI test, Release like the real app)
        run: |
          xcodebuild -project SalaryApp.xcodeproj -scheme SalaryApp -configuration Release \
            -sdk iphonesimulator -destination "id=$UDID" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build-for-testing > ci-output/build.log 2>&1 \
            || { grep -E "error:|warning: .*(isolat|Sendable)" ci-output/build.log | sort -u | head -40 | sed 's/^/::error::/'; exit 1; }
          grep -cE "warning:" ci-output/build.log || true

      - name: Create test workbooks for two months (made-up names)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q openpyxl
          mkdir -p test-files
          .venv/bin/python ci/make_test_xlsx.py "test-files/تشرين الاول 2026.xlsx" oct.txt 26000
          .venv/bin/python ci/make_test_xlsx.py "test-files/أيلول 2026.xlsx" sep.txt 3000 previous
          .venv/bin/python ci/make_test_iban.py
          # المجموع المتوقع للملفين معاً
          cat oct.txt sep.txt | python3 -c '
          import sys, re
          e = d = 0
          for line in sys.stdin:
              m = dict(re.findall(r"(\w+)=(\d+)", line)); e += int(m["employees"]); d += int(m["deductions"])
          print(f"employees={e} deductions={d} months=2")' > ci-output/expected.txt
          cat ci-output/expected.txt
          # ملفان منفصلان لنفس الشهر (رواتب فقط، واستقطاعات فقط) لاختبار التعرّف التلقائي
          .venv/bin/python - <<'PY'
          from openpyxl import load_workbook, Workbook
          src = load_workbook("test-files/أيلول 2026.xlsx", read_only=True)
          for sheet, out in zip(src.worksheets, ["test-files/split/رواتب آب 2026.xlsx", "test-files/split/استقطاعات آب 2026.xlsx"]):
              wb = Workbook(write_only=True); ws = wb.create_sheet(sheet.title)
              for row in sheet.iter_rows(values_only=True): ws.append(list(row))
              import os; os.makedirs("test-files/split", exist_ok=True); wb.save(out)
          PY
          sed 's/$/ months=1/' sep.txt > ci-output/expected-split.txt
          # ملف غير متوافق (لا اسم ولا صافي راتب) لاختبار رسالة الرفض
          .venv/bin/python -c "
          from openpyxl import Workbook
          wb = Workbook(); ws = wb.active; ws.append(['التاريخ', 'الوصف', 'القيمة']); ws.append(['2026-10-01', 'مثال', 100])
          wb.save('test-files/split/ملف غير متوافق.xlsx')"
          cat ci-output/expected-split.txt

      - name: Boot simulator and install
        run: |
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl ui "$UDID" appearance light
          # تسجيل وجه في المحاكي حتى يظهر "Face ID" في شاشة القفل والإعدادات
          xcrun simctl spawn "$UDID" notifyutil -s com.apple.BiometricKit.enrollmentChanged 1 || true
          xcrun simctl spawn "$UDID" notifyutil -p com.apple.BiometricKit.enrollmentChanged || true
          xcrun simctl install "$UDID" build/Build/Products/Release-iphonesimulator/SalaryApp.app
          DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data)
          mkdir -p "$DATA/Documents"
          cp test-files/*.xlsx test-files/split/*.xlsx "$DATA/Documents/"
          echo "DATA=$DATA" >> "$GITHUB_ENV"

      - name: Verify deduction comparison and duplicate accounting
        run: |
          rm -f "$DATA/Documents/import-report.txt"
          xcrun simctl launch "$UDID" "$BUNDLE" -tab reports -deductionAuditTest YES
          for i in $(seq 1 90); do
            [ -f "$DATA/Documents/import-report.txt" ] && break
            sleep 1
          done
          cat "$DATA/Documents/import-report.txt" | tee ci-output/deduction-audit-report.txt
          if ! grep -q '^deductionAudit=ok ' ci-output/deduction-audit-report.txt; then
            echo "::error::Deduction audit regression test failed"
            exit 1
          fi
          xcrun simctl terminate "$UDID" "$BUNDLE"
          rm -f "$DATA/Documents/import-report.txt"

      - name: Run app and take screenshots
        run: |
          launch() {
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE" -AppleLanguages "(ar)" -AppleLocale ar_IQ "$@"
          }
          shot() { sleep "${2:-5}"; xcrun simctl io "$UDID" screenshot "ci-output/screenshots/$1.png"; }
          check_accounts() {
            rm -f "$DATA/Documents/import-report.txt"
            launch -importFile "$DATA/Documents/IBAN-1.xlsx"
            DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data)
            for i in $(seq 1 90); do [ -f "$DATA/Documents/import-report.txt" ] && break; sleep 1; done
            cat "$DATA/Documents/import-report.txt" 2>/dev/null || echo '::warning::No IBAN import report was written'
            if [ ! -f "$DATA/Documents/import-report.txt" ]; then
              cat "$DATA/Documents/import-stage.txt" 2>/dev/null || true
              cp "$DATA/Documents/import-stage.txt" ci-output/import-stage.txt 2>/dev/null || true
              xcrun simctl io "$UDID" screenshot ci-output/screenshots/02d-iban-stalled.png || true
              xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'process == "SalaryApp" AND (messageType == fault OR messageType == error)' 2>/dev/null | tail -60 || true
              xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'eventMessage CONTAINS "SalaryApp"' 2>/dev/null | tail -200 > ci-output/iban-system.log || true
              for crash in $(find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f -name 'SalaryApp*' -mmin -5 | head -3); do
                echo "::group::Crash report $(basename "$crash")"
                head -c 28000 "$crash" || true
                cp "$crash" ci-output/ 2>/dev/null || true
                echo '::endgroup::'
              done
            fi
            grep -q 'accountsAdded=2 accountsUpdated=0 accountsInvalid=0' "$DATA/Documents/import-report.txt" || { echo '::error::IBAN initial import failed'; exit 1; }
            rm -f "$DATA/Documents/import-report.txt"
            launch -importFile "$DATA/Documents/IBAN-2.xlsx" -importReview YES
            shot 02d-iban-review 6
            launch -importFile "$DATA/Documents/IBAN-2.xlsx"
            DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data)
            for i in $(seq 1 90); do [ -f "$DATA/Documents/import-report.txt" ] && break; sleep 1; done
            cat "$DATA/Documents/import-report.txt" 2>/dev/null || echo '::warning::No updated IBAN import report was written'
            grep -q 'accountsAdded=1 accountsUpdated=1 accountsInvalid=3' "$DATA/Documents/import-report.txt" || { echo '::error::IBAN incremental import failed'; exit 1; }
            launch -tab settings -openAccounts YES
            shot 08h-execution-accounts 5
          }

          if [ "$QUICK" = true ]; then
            check_accounts
            rm -f "$DATA/Documents/import-report.txt"
            launch -importFile "$DATA/Documents/تشرين الاول 2026.xlsx|$DATA/Documents/أيلول 2026.xlsx"
            for i in $(seq 1 180); do [ -f "$DATA/Documents/import-report.txt" ] && break; sleep 1; done
            cat "$DATA/Documents/import-report.txt" | tee ci-output/import-report.txt
            grep -Fq "$(cat ci-output/expected.txt)" ci-output/import-report.txt || { echo '::error::Payroll import did not complete'; exit 1; }
            if [ "$BACKUP_ONLY" = true ]; then exit 0; fi
            launch -tab reports -compareDeductions YES
            shot 08z-deduction-comparison 8
            launch
            shot 03a-system-glass-bar 4
            shot 03b-home-audit-cards 1
            if [ "$DEDUCTIONS_ONLY" = true ]; then exit 0; fi
            launch -tab search -search "أحمد علي حسين الدليمي" -openPerson YES
            shot 09a-system-glass-bar-share 6
            launch -tab reports
            shot 08n-reports-root 6
            launch -tab reports -reportByEntity NO -openReport YES -openReportTitle "تنفيذ الرمادي"
            shot 08o-report-deduction-detail 6
            launch -tab reports -reportByEntity NO -openReport YES -openReportTitle "تنفيذ الرمادي" -previewReport YES
            shot 08w-report-preview 8
            launch -tab reports -exportSheet single
            shot 08t-export-single 5
            xcrun simctl ui "$UDID" appearance dark
            launch -tab reports -reportByEntity NO -openReport YES -openReportTitle "تنفيذ الرمادي"
            shot 12-report-actions-dark 5
            exit 0
          fi

          # 1) أول تشغيل بدون بيانات
          launch
          shot 01-empty

          # 2) استيراد ملفين معاً (شهران) وانتظار التقرير
          launch -importFile "$DATA/Documents/تشرين الاول 2026.xlsx|$DATA/Documents/أيلول 2026.xlsx"
          for i in $(seq 1 300); do
            [ -f "$DATA/Documents/import-report.txt" ] && break
            # شريط تقدّم الاستيراد أثناء العمل
            [ "$i" = 5 ] && xcrun simctl io "$UDID" screenshot ci-output/screenshots/01b-importing.png
            [ "$i" = 12 ] && xcrun simctl io "$UDID" screenshot ci-output/screenshots/01c-importing.png
            sleep 1
          done
          { cat "$DATA/Documents/import-report.txt" 2>/dev/null || echo "error=no report after 300s"; } | tee ci-output/import-report.txt
          shot 02-import-done 2
          check_accounts
          launch
          shot 03b-home-audit-cards 4

          # 2b) ملفان منفصلان: نافذة المراجعة (التعرّف على النوع والشهر)، ثم الاستيراد
          SPLIT="$DATA/Documents/رواتب آب 2026.xlsx|$DATA/Documents/استقطاعات آب 2026.xlsx"
          launch -importFile "$SPLIT" -importReview YES
          shot 02b-import-review 10
          rm -f "$DATA/Documents/import-report.txt"
          launch -importFile "$SPLIT"
          for i in $(seq 1 120); do [ -f "$DATA/Documents/import-report.txt" ] && break; sleep 1; done
          { cat "$DATA/Documents/import-report.txt" 2>/dev/null || echo "error=no split report"; } | tee ci-output/import-split-report.txt

          # 2c) ملف غير متوافق: رسالة الرفض بالسبب
          launch -importFile "$DATA/Documents/ملف غير متوافق.xlsx" -importReview YES
          shot 02c-import-rejected 8

          # 3) الشاشة الرئيسية: أحدث شهر (تشرين الاول) مختار تلقائياً
          launch
          shot 03-month-latest
          # شريط النظام الزجاجي: البحث المستقل والتصغير مع التمرير.
          shot 03a-system-glass-bar

          # 4) البحث بالاسم
          launch -search "احمد علي"
          shot 04-search

          # 5) تفاصيل موظف لديه استقطاعات من ورقة الاستقطاعات فقط
          #    (الاسم هناك مكتوب "احمد" بلا همزة، وعمود "شركة الاتصالات" داخل ورقة الرواتب يجب ألا يظهر)
          launch -search "أحمد علي حسين الدليمي" -openFirst YES
          shot 05-detail-october

          # 6) تفاصيل موظف بدون استقطاعات
          launch -search "عمر خالد جاسم" -openFirst YES
          shot 06-detail-no-deductions

          # 7) اختيار شهر أيلول: الشاشة الرئيسية ثم نفس الموظف براتب واستقطاعات مختلفة
          launch -selectedMonth "أيلول 2026"
          shot 07-month-september
          launch -selectedMonth "أيلول 2026" -search "أحمد علي حسين الدليمي" -openFirst YES
          shot 08-detail-september

          # 8b) عدة أشهر معاً: النتائج من الشهرين مع اسم الشهر تحت كل اسم
          launch -selectedMonth "تشرين الاول 2026|أيلول 2026" -search "احمد علي"
          shot 08b-multi-month-search

          # 8c) فلترة العرض: الاستقطاعات فقط، ثم الراتب والاستقطاعات معاً
          launch -selectedMonth "تشرين الاول 2026|أيلول 2026" -search "أحمد علي حسين الدليمي" -showSalary NO -showDeductions YES
          shot 08c-deductions-only
          launch -selectedMonth "تشرين الاول 2026|أيلول 2026" -search "أحمد علي حسين الدليمي" -showDeductions YES
          shot 08d-salary-and-deductions

          # 8e) الإعدادات، ثم الواجهة بالإنجليزية والأرقام الهندية
          launch -openSettings YES
          shot 08e-settings
          launch -openSettings YES -openBackup YES
          shot 08e2-backup
          # حجم النص: أصغر مستوى ثم أكبر مستوى
          launch -openSettings YES -appTextSize 0
          shot 08e4-text-small
          launch -appTextSize 6
          shot 08e5-text-large-home
          launch -appLanguage en -selectedMonth "تشرين الاول 2026|أيلول 2026" -search "أحمد علي حسين الدليمي" -showDeductions YES
          shot 08f-english
          launch -appNumerals arabicIndic -search "احمد علي"
          shot 08g-eastern-digits


          # 8i) البحث الموحّد: قبل البحث، ثم نتائج كبطاقات
          launch -tab search
          shot 08i-unified-empty
          launch -tab search -search "أحمد علي"
          shot 08j-unified-results
          launch -tab search -search "أحمد علي حسين الدليمي" -openPerson YES
          shot 09a-system-glass-bar-share 8
          shot 08k-person-salary
          launch -tab search -search "أحمد علي حسين الدليمي" -openPerson YES -personPart months
          shot 08l-person-months
          launch -tab search -search "أحمد علي حسين الدليمي" -openPerson YES -share YES
          shot 08m-person-share 8

          # 8n) التقارير: الاستقطاعات حسب الجهة، ثم بنود جدول الرواتب، ثم تفاصيل أول مجموعة
          launch -tab reports -reportKind deductions
          shot 08n-reports-deductions 7
          launch -tab reports -reportKind deductions -reportByEntity YES -openReport YES
          shot 08o-report-deduction-detail 8
          launch -tab reports -reportKind payroll
          shot 08p-reports-payroll 6
          launch -tab reports -reportKind payroll -openReport YES
          shot 08q-report-payroll-detail 8
          # نافذة التصدير العائمة: جهة واحدة (بحث) ثم مجموعة جهات
          launch -tab reports -exportSheet single -exportSearch "الرمادي"
          shot 08t-export-single 6
          launch -tab reports -exportSheet group
          shot 08u-export-group 6
          # التدقيق: الصفحة، ثم فحص المحرك على بيانات الاختبار
          launch -tab reports -reportsAudit YES
          shot 08x-audit 8
          launch -tab reports -compareDeductions YES
          shot 08z-deduction-comparison 8
          launch -tab reports -compareDeductions YES -deductionKind changed
          shot 08z2-deduction-changed 10
          launch -tab reports -compareDeductions YES -auditExportSheet YES
          shot 08z3-deduction-export 10
          launch -tab reports -salaryAudit YES
          shot 08x2-salary-audit 12
          launch -tab reports -salaryAudit YES -salaryAuditKind net
          shot 08x3-salary-net 12
          launch -tab reports -salaryAudit YES -auditExportSheet YES
          shot 08x4-salary-export 12
          launch -tab settings -openNotifications YES
          shot 08w2-notifications 5
          launch
          shot 03c-home-dashboard 14
          launch -homeScroll YES
          shot 03d-home-dashboard-bottom 16
          rm -f "$DATA/Documents/import-report.txt"
          launch -tab reports -auditTest YES
          for i in $(seq 1 90); do grep -q audit "$DATA/Documents/import-report.txt" 2>/dev/null && break; sleep 1; done
          r=$(cat "$DATA/Documents/import-report.txt" 2>/dev/null || echo "audit=failed no report")
          case "$r" in audit=ok*) echo "::notice::Audit: $r";; *) echo "::error::Audit: $r";; esac
          shot 08y-reports-with-audit 4
          # قائمة جهات التنفيذ، ثم معاينة جدول جهة
          launch -tab reports -reportsEntities YES -reportByEntity NO
          shot 08v-entities 6
          launch -tab reports -reportByEntity NO -openReport YES -openReportTitle "تنفيذ الرمادي" -previewReport YES
          shot 08w-report-preview 10

          # 8r) تصدير كشف جهة استقطاع (Excel + PDF) بشكل النموذج
          rm -f "$DATA/Documents/import-report.txt"
          launch -tab reports -reportKind deductions -reportByEntity NO -openReport YES -exportReport YES
          for i in $(seq 1 60); do [ -f "$DATA/Documents/import-report.txt" ] && break; sleep 1; done
          cat "$DATA/Documents/import-report.txt" || echo "::error::no export report"
          shot 08r-report-export 3
          mkdir -p ci-output/report-export
          cp "$DATA"/tmp/report-export/* ci-output/report-export/ 2>/dev/null || echo "::error::No exported report files"
          # الكشوف الخاصة: صندوق الشهداء، عقد الإطعام (عراق الجوال)، الرعاية الصحية
          for item in "صندوق الشهداء" "عراق الجوال" "الرعاية الصحية"; do
            rm -f "$DATA/Documents/import-report.txt"
            launch -tab reports -reportKind payroll -openReport YES -openReportTitle "$item" -exportReport YES
            for i in $(seq 1 90); do [ -f "$DATA/Documents/import-report.txt" ] && break; sleep 1; done
            echo "$item: $(cat "$DATA/Documents/import-report.txt" 2>/dev/null || echo '::error::no export report')"
            shot "08s-report-$(echo "$item" | tr ' ' '-')" 2
            cp "$DATA"/tmp/report-export/* ci-output/report-export/ 2>/dev/null || true
          done
          # التصدير المجمّع: Excel بورقة لكل جهة + PDF مجمّع
          for cat in directorates banks all; do
            rm -f "$DATA/Documents/import-report.txt"
            launch -tab reports -bulkExport $cat
            for i in $(seq 1 90); do [ -f "$DATA/Documents/import-report.txt" ] && break; sleep 1; done
            r=$(cat "$DATA/Documents/import-report.txt" 2>/dev/null || echo "bulk=failed no report")
            echo "$cat: $r"
            case "$r" in bulk=ok*) echo "::notice::Bulk $cat: $r";; *) echo "::error::Bulk $cat: $r";; esac
            cp "$DATA"/tmp/report-export/* ci-output/report-export/ 2>/dev/null || true
          done
          n=0
          for f in ci-output/report-export/*.pdf; do n=$((n+1)); sips -s format png "$f" --out "ci-output/report-export/page-$n.png" >/dev/null 2>&1 || true; done
          ls -la ci-output/report-export

          # 9) نافذة المشاركة (نسخ كصورة / تصدير PDF / مشاركة كصورة) + الملفات المُصدَّرة
          launch -search "أحمد علي حسين الدليمي" -openFirst YES -share YES
          shot 09-share-sheet 8
          mkdir -p ci-output/exports
          cp "$DATA"/tmp/share/* ci-output/exports/ 2>/dev/null || echo "::error::No exported files in tmp/share"
          ls "$DATA"/tmp/share/ | grep -q "تقرير راتب" && echo "::notice::Salary report PDF created" || echo "::error::No salary report PDF"
          for f in ci-output/exports/تقرير*.pdf; do [ -f "$f" ] && sips -s format png "$f" --out "ci-output/screenshots/09s-salary-report.png" >/dev/null 2>&1 || true; done
          launch -search "أحمد علي حسين الدليمي" -openFirst YES -share YES -shareMode image
          shot 09a-share-image 6
          ls -la ci-output/exports
          file ci-output/exports/* || true

          # 9b) قفل Face ID: شاشة القفل، ثم قسم الأمان في الإعدادات
          launch -faceIDLock YES -lockPreview YES
          shot 09b-faceid-lock
          launch -faceIDLock YES -skipLock YES -openSettings YES
          shot 09c-settings-security

          # 10) الوضع الداكن
          xcrun simctl ui "$UDID" appearance dark
          launch -search "أحمد علي حسين الدليمي" -openFirst YES
          shot 10-detail-dark
          launch -search "احمد علي"
          shot 11-search-dark

      - name: Navigation test (taps, typing, open/back, scrolling) with video and lag log
        if: inputs.backup_only != true
        run: |
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
          if [ "$DEDUCTIONS_ONLY" != true ]; then
            # ملاك وهمي بحجم الملاك الحقيقي (42 ألف) لقياس البحث الموحّد في الحالة الأثقل
            rm -f "$DATA/Documents/import-report.txt"
            xcrun simctl launch "$UDID" "$BUNDLE" -fakeStaff 42000
            for i in $(seq 1 300); do [ -f "$DATA/Documents/import-report.txt" ] && break; sleep 1; done
            { cat "$DATA/Documents/import-report.txt" 2>/dev/null || echo "error=no staff report"; } | tee ci-output/fake-staff.txt
            sleep 2
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
          fi
          rm -f "$DATA/Documents/perf.txt"

          xcrun simctl io "$UDID" recordVideo --codec=h264 --force ci-output/navigation.mp4 &
          VPID=$!
          sleep 3
          TEST_FILTER=(-only-testing:SalaryAppUITests/NavigationTests)
          if [ "$QUICK" = true ]; then
            TEST_FILTER=(-only-testing:SalaryAppUITests/NavigationTests/testSystemNavigationBar -only-testing:SalaryAppUITests/NavigationTests/testReportActions -only-testing:SalaryAppUITests/NavigationTests/testNavigationFlow -only-testing:SalaryAppUITests/NavigationTests/testDeductionComparison -only-testing:SalaryAppUITests/NavigationTests/testStaffSearchModes -only-testing:SalaryAppUITests/NavigationTests/testExecutionAccountsMerge)
          fi
          if [ "$DEDUCTIONS_ONLY" = true ]; then
            TEST_FILTER=(-only-testing:SalaryAppUITests/NavigationTests/testDeductionComparison)
          fi
          set +e
          xcodebuild test-without-building -project SalaryApp.xcodeproj -scheme SalaryApp -configuration Release \
            -destination "id=$UDID" -derivedDataPath build "${TEST_FILTER[@]}" \
            CODE_SIGNING_ALLOWED=NO > ci-output/uitest.log 2>&1
          STATUS=$?
          set -e
          sleep 1
          kill -INT $VPID 2>/dev/null || true
          wait $VPID 2>/dev/null || true
          ls -la ci-output/navigation.mp4 || true

          DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data)
          cp "$DATA/Documents/perf.txt" ci-output/perf.txt 2>/dev/null || echo "::warning::no perf.txt"
          python3 ci/perf_report.py ci-output/uitest.log ci-output/perf.txt | tee ci-output/navigation-report.txt
          echo "$STATUS" > ci-output/uitest-status.txt
          echo "xcodebuild test status=$STATUS"
          grep -E "error:|XCTAssert|Failed|failed:" ci-output/uitest.log | sort -u | head -30 | sed 's/^/::warning::/' || true
          grep -E "^(PICKER|IMPORT|REJECT|RESULT)" ci-output/uitest.log | sed 's/^/::notice::/' || true

      # المشاركة الحقيقية: "حفظ في الملفات" (PDF وExcel) ثم "نسخ"، والتحقق أن الملف المحفوظ سليم وأن الحافظة فيها الملف.
      - name: Share sheet end-to-end (Save to Files, Copy)
        if: inputs.deductions_only != true && inputs.backup_only != true
        run: |
          DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data)
          DEV="$HOME/Library/Developer/CoreSimulator/Devices/$UDID/data"
          xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
          touch ci-output/share-start
          fail=0
          for t in testSaveToFiles testSaveExcelToFiles testCopy; do
            DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data)
            rm -f "$DATA/Documents/import-report.txt"
            set +e
            xcodebuild test-without-building -project SalaryApp.xcodeproj -scheme SalaryApp -configuration Release \
              -destination "id=$UDID" -derivedDataPath build -only-testing:SalaryAppUITests/ShareTests/$t \
              CODE_SIGNING_ALLOWED=NO > "ci-output/share-$t.log" 2>&1
            st=$?
            set -e
            DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data)
            echo "$t status=$st" | tee -a ci-output/share-report.txt
            grep -E "error:|failed|XCTAssert" "ci-output/share-$t.log" | sort -u | head -8 | sed 's/^/::warning::/' || true
            { cat "$DATA/Documents/import-report.txt" 2>/dev/null || echo "(no share report)"; } | tee -a ci-output/share-report.txt; echo >> ci-output/share-report.txt
            [ "$st" = 0 ] || fail=1
          done
          # الملفات المحفوظة في "الملفات" (On My iPhone) أثناء هذا الاختبار
          ls -laR "$DATA/tmp/Sharing" 2>/dev/null | head -20 | tee -a ci-output/share-report.txt || true
          find "$DEV" -type f -newer ci-output/share-start \( -name "*.pdf" -o -name "*.xlsx" \) -not -path "*/$BUNDLE*" 2>/dev/null | grep -v "/tmp/Sharing/\|/tmp/report-export/" | head -20 | tee -a ci-output/share-report.txt || true
          find "$DEV" -path "*File Provider Storage*" -type f -newer ci-output/share-start \( -name "*.pdf" -o -name "*.xlsx" \) -print0 2>/dev/null | while IFS= read -r -d '' f; do
            size=$(stat -f%z "$f"); head=$(head -c 4 "$f" | xxd -p)
            echo "saved: $(basename "$f") size=$size head=$head" | tee -a ci-output/share-report.txt
            mkdir -p ci-output/shared-files && cp "$f" ci-output/shared-files/
          done
          grep -q "saved: .*\.pdf size=[1-9][0-9]* head=25504446" ci-output/share-report.txt && echo "::notice::Saved PDF is valid" || { echo "::error::Saved PDF missing or corrupt"; fail=1; }
          grep -q "saved: .*\.xlsx size=[1-9][0-9]* head=504b0304" ci-output/share-report.txt && echo "::notice::Saved Excel is valid" || { echo "::error::Saved Excel missing or corrupt"; fail=1; }
          grep -q "activity=com.apple.UIKit.activity.CopyToPasteboard completed=true .*com.adobe.pdf.* bytes=[1-9]" ci-output/share-report.txt && echo "::notice::Copy put the PDF on the pasteboard" || { echo "::error::Copy did not put the PDF on the pasteboard"; fail=1; }
          exit $fail

      - name: Autopilot lag test (in-app navigation, no XCUITest overhead)
        if: inputs.deductions_only != true && inputs.backup_only != true
        run: |
          DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data)
          xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
          rm -f "$DATA/Documents/perf.txt" "$DATA/Documents/import-report.txt"
          xcrun simctl launch "$UDID" "$BUNDLE" -AppleLanguages "(ar)" -AppleLocale ar_IQ -perfLog YES -autopilot YES
          for i in $(seq 1 180); do grep -q autopilot "$DATA/Documents/import-report.txt" 2>/dev/null && break; sleep 1; done
          sleep 1
          cp "$DATA/Documents/perf.txt" ci-output/perf-autopilot.txt 2>/dev/null || echo "::warning::no autopilot perf.txt"
          printf "" > ci-output/empty.log
          python3 ci/perf_report.py ci-output/empty.log ci-output/perf-autopilot.txt | tee ci-output/autopilot-report.txt

      - name: Backup round trip and rejection of corrupted records
        if: inputs.quick != true || inputs.backup_only == true
        run: |
          DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data)
          xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
          rm -f "$DATA/Documents/import-report.txt"
          xcrun simctl launch "$UDID" "$BUNDLE" -AppleLanguages "(ar)" -backupTest YES
          for i in $(seq 1 300); do grep -q backup "$DATA/Documents/import-report.txt" 2>/dev/null && break; sleep 1; done
          { cat "$DATA/Documents/import-report.txt" 2>/dev/null || echo "backup=failed no report"; } | tee ci-output/backup-report.txt
          grep -q "backup=ok" ci-output/backup-report.txt && echo "::notice::Backup OK: $(cat ci-output/backup-report.txt)" \
            || echo "::error::Backup round trip failed: $(cat ci-output/backup-report.txt)"
          grep -q "corruptRestore=ok" ci-output/backup-report.txt || { echo "::error::Corrupt backup changed existing data"; exit 1; }
          # النسخ التلقائي إلى مجلد التطبيق (نسخة واحدة تُستبدل)
          xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
          rm -f "$DATA/Documents/import-report.txt"
          xcrun simctl launch "$UDID" "$BUNDLE" -AppleLanguages "(ar)" -autoBackupTest YES
          for i in $(seq 1 300); do grep -q autobackup "$DATA/Documents/import-report.txt" 2>/dev/null && break; sleep 1; done
          { cat "$DATA/Documents/import-report.txt" 2>/dev/null || echo "autobackup=failed no report"; } | tee ci-output/autobackup-report.txt
          grep -q "autobackup=ok" ci-output/autobackup-report.txt && echo "::notice::Auto backup OK: $(cat ci-output/autobackup-report.txt)" \
            || echo "::error::Auto backup failed: $(cat ci-output/autobackup-report.txt)"
          xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
          xcrun simctl launch "$UDID" "$BUNDLE" -AppleLanguages "(ar)" -openSettings YES -openBackup YES
          sleep 6
          xcrun simctl io "$UDID" screenshot ci-output/screenshots/08e3-backup-after-auto.png || true

      - name: Enforce navigation test result
        if: inputs.backup_only != true
        run: |
          [ -f ci-output/uitest-status.txt ] || { echo "::error::UI tests did not produce a result"; exit 1; }
          [ "$(cat ci-output/uitest-status.txt)" = 0 ] || { echo "::error::UI navigation tests failed; inspect uitest.log"; exit 1; }

      - name: Check import result
        if: inputs.quick != true
        run: |
          expected=$(cat ci-output/expected.txt)
          actual=$(sed 's/ seconds=.*//' ci-output/import-report.txt)
          echo "expected: $expected"; echo "actual:   $actual"
          [ "$expected" = "$actual" ] || { echo "::error::Import mismatch: expected '$expected', got '$(cat ci-output/import-report.txt)'"; exit 1; }
          echo "::notice::Import OK: $(cat ci-output/import-report.txt)"
          expected=$(sed 's/ $//' ci-output/expected-split.txt)
          actual=$(sed 's/ seconds=.*//' ci-output/import-split-report.txt)
          echo "split expected: $expected"; echo "split actual:   $actual"
          [ "$expected" = "$actual" ] || { echo "::error::Split import mismatch: expected '$expected', got '$(cat ci-output/import-split-report.txt)'"; exit 1; }
          echo "::notice::Split import OK: $(cat ci-output/import-split-report.txt)"

      - name: Publish screenshots to 'screenshots' branch
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # الفيديو الأصلي كبير (حد GitHub 100MB): نسخة مصغّرة فقط
          if [ -f ci-output/navigation.mp4 ]; then
            avconvert --source ci-output/navigation.mp4 --preset Preset960x540 --output ci-output/navigation-small.mp4 --replace \
              && rm ci-output/navigation.mp4 || true
            [ -f ci-output/navigation.mp4 ] && [ $(stat -f%z ci-output/navigation.mp4) -gt 90000000 ] && rm ci-output/navigation.mp4
            ls -la ci-output/*.mp4 || true
          fi
          tail -n 200 ci-output/build.log > ci-output/build-tail.log 2>/dev/null || true
          rm -f ci-output/build.log
          cd ci-output
          git init -q -b screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Simulator run for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots
          path: ci-output
