name: Verify captured simulator results
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Completed simulator run whose application sources are unchanged
        required: true
        type: string
permissions:
  contents: read
  actions: read
  checks: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify every application check and recheck the old-month expectation
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: python3 ci/verify_simulator_results.py "$SOURCE_RUN"
