name: Windows desktop checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build windows/PayrollWindows.sln -c Release
      - name: Test fictional backup data
        run: dotnet test windows/PayrollWindows.sln -c Release --no-build
      - name: Create installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          ./windows/build-installer.ps1 -Version "0.1.${{ github.run_number }}"
      - name: Smoke test installer and desktop startup
        shell: pwsh
        run: |
          $setup = (Resolve-Path windows/installer/output/PayrollWindows-Setup.exe).Path
          $install = Join-Path $env:RUNNER_TEMP 'PayrollInstall'
          $process = Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$install") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $exe = Join-Path $install 'Payroll.Desktop.exe'
          if (-not (Test-Path $exe)) { throw 'Installed executable is missing.' }
          $app = Start-Process $exe -PassThru
          try {
            Start-Sleep -Seconds 8
            $app.Refresh()
            if ($app.HasExited) { throw "Application exited: $($app.ExitCode)" }
          } finally { if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force } }
          $uninstaller = Get-ChildItem $install -Filter 'unins*.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw 'Uninstaller is missing.' }
          $uninstall = Start-Process $uninstaller.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path $exe)) { throw 'Uninstall failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-test
          path: windows/installer/output/PayrollWindows-Setup.exe
          retention-days: 7
