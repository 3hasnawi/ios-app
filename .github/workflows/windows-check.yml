name: Windows desktop checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Windows desktop solution
        run: dotnet build windows/SalaryDesktop.sln -c Release --nologo
      - name: Test backup, bank calculations and transfer files with fictional data
        run: dotnet run --project windows/SalaryDesktop.Tests/SalaryDesktop.Tests.csproj -c Release --no-build --no-launch-profile
        env:
          SALARY_TEST_DEBUG_FAKE: 1
      - name: Check desktop startup
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'windows/SalaryDesktop/bin/Release/net10.0-windows/SalaryDesktop.exe'
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 10
            $process.Refresh()
            if ($process.HasExited) { throw "Desktop application exited during startup with code $($process.ExitCode)." }
            Write-Host 'Desktop process remained running during startup.'
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
