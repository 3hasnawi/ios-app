name: SalaryLocal 0.6 Windows UI proof
on:
  push:
    branches: [test/salarylocal-0.6-ui-20261106]
    paths:
      - 'windows-local/**'
      - '.github/workflows/salarylocal-ui-proof.yml'
permissions:
  contents: read
jobs:
  windows-ui:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      SALARYLOCAL_UI_TEST: '1'
      PROOF_DIR: ${{ runner.temp }}/salarylocal-ui-proof
      SCREENSHOT_DIR: ${{ runner.temp }}/salarylocal-ui-proof/screens
      SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Prepare isolated proof folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:PROOF_DIR | Out-Null
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'SalaryLocal')) { throw 'Refusing to use an existing application workspace.' }
          "Source commit: $env:SOURCE_COMMIT`nWindows runner: $env:RUNNER_OS`nSynthetic data only; no release publication." | Set-Content (Join-Path $env:PROOF_DIR 'environment.txt')
      - name: Use desktop resolution
        shell: pwsh
        continue-on-error: true
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Run local data safety checks on Windows
        shell: pwsh
        run: |
          dotnet run --project windows-local/SalaryLocal.Tests/SalaryLocal.Tests.csproj -c Release -p:BuildInParallel=false 2>&1 | Tee-Object -FilePath (Join-Path $env:PROOF_DIR 'core-tests.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run actual WPF menus using fictional records
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          dotnet run --project windows-local/SalaryLocal.Smoke/SalaryLocal.Smoke.csproj -c Release -p:BuildInParallel=false 2>&1 | Tee-Object -FilePath (Join-Path $env:PROOF_DIR 'ui-smoke.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload runtime captures and proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SalaryLocal-0.6-Windows-UI-proof
          path: ${{ runner.temp }}/salarylocal-ui-proof/
          if-no-files-found: error
          retention-days: 3
