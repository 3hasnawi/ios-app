name: Refund amount and history UI check
on: workflow_dispatch
permissions:
  contents: read
jobs:
  refund:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare iPhone and synthetic payroll
        run: |
          set -eo pipefail
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode/Contents/Developer"
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys,re; d=json.load(sys.stdin)["devices"]; r=max((k for k in d if "iOS" in k and any(v["name"].startswith("iPhone") for v in d[k])),key=lambda k:list(map(int,re.findall(r"\d+",k.split("iOS")[-1])))); print(next(v["udid"] for v in d[r] if v["name"].startswith("iPhone")))')
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          brew install xcodegen
          xcodegen generate
          python3 -m venv .venv
          .venv/bin/pip -q install openpyxl
          .venv/bin/python ci/make_test_xlsx.py "تشرين الاول 2026.xlsx" expected.txt 12
      - name: Build tests and import workbook
        run: |
          xcodebuild -quiet -project SalaryApp.xcodeproj -scheme SalaryApp -configuration Debug -destination "id=$UDID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES build-for-testing
          xcrun simctl bootstatus "$UDID" -b
          bundle=com.example.SalaryApp
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/SalaryApp.app
          data=$(xcrun simctl get_app_container "$UDID" "$bundle" data)
          mkdir -p "$data/Documents"
          cp "تشرين الاول 2026.xlsx" "$data/Documents/"
          xcrun simctl launch "$UDID" "$bundle" -importFile "$data/Documents/تشرين الاول 2026.xlsx"
          for i in $(seq 1 90); do test -f "$data/Documents/import-report.txt" && break; sleep 1; done
          grep '^employees=12 .*months=1 ' "$data/Documents/import-report.txt"
          if grep -q ' failed=' "$data/Documents/import-report.txt"; then exit 1; fi
          xcrun simctl terminate "$UDID" "$bundle"
      - name: Exercise search, live amounts and archived batch actions
        run: |
          xcodebuild -project SalaryApp.xcodeproj -scheme SalaryApp -configuration Debug -destination "id=$UDID" -derivedDataPath build -resultBundlePath RefundUI.xcresult -parallel-testing-enabled NO -only-testing:SalaryAppUITests/RefundInputTests/testRefundAmountAndHistoryMenu test-without-building
      - name: Export screenshots and diagnostics
        if: always() && hashFiles('RefundUI.xcresult/Info.plist') != ''
        run: xcrun xcresulttool export attachments --path RefundUI.xcresult --output-path captures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refund-input-simulator
          path: captures
          retention-days: 7
