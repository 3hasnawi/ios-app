name: Windows accounting desktop
on: workflow_dispatch
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install the x64 Access provider for the native database import test
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'access-provider.exe'
          curl.exe -fsSL --retry 3 'https://download.microsoft.com/download/3/5/c/35c84c36-661a-44e6-9324-8786b8dbe231/accessdatabaseengine_X64.exe' -o $installer
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $sig = Get-AuthenticodeSignature $installer
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notlike '*CN=Microsoft Corporation,*') { throw "Invalid Microsoft provider signature" }
          $p = Start-Process $installer -ArgumentList '/quiet', '/norestart' -Wait -PassThru
          if ($p.ExitCode -notin 0,3010) { throw "Access test provider installation failed ($($p.ExitCode))" }
      - name: Test archive compatibility, totals, reports and restore
        run: |
          python windows/Checks/fixture.py "$env:RUNNER_TEMP/fixture"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project windows/Checks/Payroll.Checks.csproj -c Release -- "$env:RUNNER_TEMP/fixture"
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-windows-exchange
          path: ${{ runner.temp }}/fixture/exchange
      - name: Publish desktop
        run: dotnet publish windows/Desktop/Payroll.Desktop.csproj -c Release -r win-x64 --self-contained true -o "$env:RUNNER_TEMP/app"
      - name: Build and install single setup
        run: |
          $runtime = "$env:RUNNER_TEMP\MicrosoftEdgeWebView2RuntimeInstallerX64.exe"
          curl.exe -fsSL --retry 3 'https://go.microsoft.com/fwlink/p/?LinkId=2124701' -o $runtime
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $sig = Get-AuthenticodeSignature $runtime
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notlike '*CN=Microsoft Corporation,*') { throw "Invalid Microsoft runtime signature" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DWebRuntime=$runtime" "/DPublishDir=$env:RUNNER_TEMP\app" "/DInstallerDir=$env:RUNNER_TEMP\installer" windows/Packaging/desktop.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $p = Start-Process "$env:RUNNER_TEMP\installer\AnbarPayroll-Setup.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=$env:RUNNER_TEMP\installed" -Wait -PassThru
          exit $p.ExitCode
      - name: Exercise installed application and capture screens
        run: |
          $p = Start-Process "$env:RUNNER_TEMP\installed\AnbarPayroll.exe" -ArgumentList "--capture $env:RUNNER_TEMP\fixture\print-source $env:RUNNER_TEMP\screens" -PassThru
          if (-not $p.WaitForExit(100000)) { $p.Kill(); throw "Window capture timed out" }
          if ($p.ExitCode -ne 0) { throw "Desktop exited with $($p.ExitCode)" }
          if ((Get-ChildItem "$env:RUNNER_TEMP\screens\*.png").Count -ne 17) { throw "Incomplete captures" }
      - name: Inspect printed tables and page bounds
        run: |
          python -m pip install pymupdf==1.26.6
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python windows/Checks/print_pages.py "$env:RUNNER_TEMP/screens" "$env:RUNNER_TEMP/fixture/printed"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: ${{ runner.temp }}/installer/AnbarPayroll-Setup.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screens
          path: |
            ${{ runner.temp }}/screens
            ${{ runner.temp }}/fixture/printed

  apple-readback:
    if: always() && !cancelled()
    needs: desktop
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: synthetic-windows-exchange
          path: ${{ runner.temp }}/exchange
      - name: Restore Windows output with actual iPhone archive, contract and refund code
        env:
          WINDOWS_EXCHANGE: ${{ runner.temp }}/exchange/windows-month.zip
          WINDOWS_TEMPLATE_SETTINGS: ${{ runner.temp }}/exchange/letter-settings.json
          WINDOWS_REFUND: ${{ runner.temp }}/exchange/refund.json
        run: |
          python3 ci/compact_backup_test/run.py
          unzip -p "$RUNNER_TEMP/exchange/windows-templates.zip" settings.json > "$WINDOWS_TEMPLATE_SETTINGS"
          python3 ci/employee_refund_test/run.py
      - uses: actions/download-artifact@v4
        with:
          name: windows-screens
          path: ${{ runner.temp }}/win-pages
      - name: Compare the same agency statement with the Apple CoreText reference
        run: |
          python3 ci/report_layout_test/run.py --preview-dir "$RUNNER_TEMP/apple-pages"
          python3 -m venv "$RUNNER_TEMP/pdf-tools"
          "$RUNNER_TEMP/pdf-tools/bin/pip" install pymupdf==1.26.6
          "$RUNNER_TEMP/pdf-tools/bin/python" windows/Checks/reference.py "$RUNNER_TEMP/win-pages" "$RUNNER_TEMP/apple-pages"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-print-reference
          path: ${{ runner.temp }}/apple-pages
