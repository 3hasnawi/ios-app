name: Publish existing build

# ينشر ملف ipa من بناء سابق في صفحة الإصدارات بدون إعادة البناء.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "رقم تشغيل البناء (Build iOS app)"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SalaryApp-unsigned-ipa
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Publish IPA to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp SalaryApp-unsigned.ipa SalaryApp.ipa
          TAG="run-${{ inputs.run_id }}"
          gh release create "$TAG" SalaryApp.ipa --repo "$GITHUB_REPOSITORY" \
            --title "تطبيق الرواتب — بناء ${{ inputs.run_id }}" \
            --notes "من تشغيل البناء ${{ inputs.run_id }}" --latest
