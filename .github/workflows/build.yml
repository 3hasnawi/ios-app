name: Build iOS app

on:
  # البناء يدوي فقط (بأمر من صاحب المشروع)، لا يعمل تلقائياً عند الدمج.
  workflow_dispatch:

permissions:
  contents: write   # لنشر ملف التطبيق في صفحة الإصدارات

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # رقم الإصدار يرتفع مع كل بناء: 1.<رقم البناء>، ويظهر في الإعدادات.
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project SalaryApp.xcodeproj -scheme SalaryApp -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="1.${{ github.run_number }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build 2>&1 | tee build.log || {
              # أخطاء الترجمة تظهر كملاحظات في صفحة التشغيل حتى تُقرأ بدون تنزيل السجل.
              grep -E "error:" build.log | sort -u | head -40 | while IFS= read -r line; do echo "::error::$line"; done
              exit 1
            }

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SalaryApp.app Payload/
          zip -qry SalaryApp-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SalaryApp-unsigned-ipa
          path: SalaryApp-unsigned.ipa

      # ملف ipa مباشر (بدون ضغط) في صفحة الإصدارات، يُنزَّل ويُفتح على الآيفون مباشرة.
      # آخر بناء دائماً على: https://github.com/<repo>/releases/latest/download/SalaryApp.ipa
      - name: Publish IPA to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp SalaryApp-unsigned.ipa SalaryApp.ipa
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" SalaryApp.ipa --repo "$GITHUB_REPOSITORY" \
            --title "تطبيق الرواتب — الإصدار 1.${{ github.run_number }}" \
            --notes "من الفرع ${GITHUB_REF_NAME} (${GITHUB_SHA::7})" --latest
