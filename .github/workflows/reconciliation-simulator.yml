name: Reconciliation simulator check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          brew install xcodegen
          xcodegen generate
      - name: Select simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json,re; d=json.load(sys.stdin)["devices"]; r=sorted((k for k in d if "iOS" in k),key=lambda k:[int(x) for x in re.findall(r"\d+",k.split("iOS")[-1])]); p=[x for x in d[r[-1]] if x["name"].startswith("iPhone")]; print(p[0]["udid"])')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
      - name: Build for simulator
        run: |
          xcodebuild -project SalaryApp.xcodeproj -scheme SalaryApp -configuration Debug -sdk iphonesimulator -destination "id=$UDID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > /tmp/reconciliation-build.log 2>&1 || { grep -E 'error:' /tmp/reconciliation-build.log | sort -u | head -40; exit 1; }
      - name: Test fictional reconciliation data
        run: |
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/SalaryApp.app
          DATA=$(xcrun simctl get_app_container "$UDID" com.example.SalaryApp data)
          mkdir -p "$DATA/Documents"
          rm -f "$DATA/Documents/import-report.txt"
          xcrun simctl launch "$UDID" com.example.SalaryApp -tab reports -transferFilesTest YES
          for i in $(seq 1 120); do
            [ -f "$DATA/Documents/import-report.txt" ] && break
            sleep 1
          done
          cat "$DATA/Documents/import-report.txt"
          grep -q '^transferFiles=ok ' "$DATA/Documents/import-report.txt"
      - name: Test reports back gestures
        run: |
          xcodebuild -project SalaryApp.xcodeproj -scheme SalaryApp -configuration Debug -sdk iphonesimulator -destination "id=$UDID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO -only-testing:SalaryAppUITests/NavigationTests/testReportsBackGestures test > /tmp/reports-ui-test.log 2>&1 || { tail -350 /tmp/reports-ui-test.log; exit 1; }
