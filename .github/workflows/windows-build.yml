name: Build Windows app
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: microsoft/setup-msbuild@v2
      - name: Test core with fictional data
        shell: pwsh
        run: dotnet run --project WindowsApp.Tests/WindowsApp.Tests.csproj --configuration Release
      - name: Publish unpackaged x64 app
        shell: pwsh
        working-directory: WindowsApp
        run: |
          msbuild SalaryWindows.csproj -restore -t:Publish -p:Configuration=Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:SelfContained=true -p:WindowsAppSDKSelfContained=true -p:WindowsPackageType=None "-p:PublishDir=$env:RUNNER_TEMP\SalaryWindows/"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "$env:RUNNER_TEMP\SalaryWindows\SalaryWindows.exe")) { throw 'Windows executable was not produced.' }
      - name: Check app launches
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\SalaryWindows\SalaryWindows.exe"
          $env:SALARY_STARTUP_DIAGNOSTIC = "$env:RUNNER_TEMP\salary-startup.log"
          $env:SALARY_XAML_DIAG_PATH = "$env:GITHUB_WORKSPACE\WindowsApp\MainWindow.xaml"
          $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 10
          $process.Refresh()
          if (Test-Path $env:SALARY_STARTUP_DIAGNOSTIC) { Get-Content $env:SALARY_STARTUP_DIAGNOSTIC }
          if ($process.HasExited) {
            Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-3)} -ErrorAction SilentlyContinue | Where-Object { $_.Message -match 'SalaryWindows' } | Select-Object -First 5 | Format-List TimeCreated,ProviderName,Message
            throw "Application exited during startup (code $($process.ExitCode))."
          }
          if (!(Test-Path $env:SALARY_STARTUP_DIAGNOSTIC) -or !((Get-Content $env:SALARY_STARTUP_DIAGNOSTIC -Raw) -match 'Window activated')) { Stop-Process -Id $process.Id -Force; throw 'Application window did not finish activating.' }
          Stop-Process -Id $process.Id -Force
      - name: Package and release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          تطبيق الرواتب لويندوز 11 - نسخة تجريبية للقراءة فقط
          فك الضغط عن كامل الملف، ثم افتح SalaryWindows.exe.
          في التطبيق اختر نسخة ZIP أو السيرفر المحلي لعرض البيانات.
          لا توجد مزامنة أو تعديل للبيانات من نسخة ويندوز حالياً.
          احتفظ بنسخة احتياطية مستقلة، وراجع النتائج مع تطبيق الآيفون قبل اعتمادها.
          اتصال السيرفر المحلي HTTP غير مشفّر؛ استخدم شبكة موثوقة فقط.
          '@ | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\SalaryWindows\اقرأني.txt"
          Compress-Archive -Path "$env:RUNNER_TEMP\SalaryWindows\*" -DestinationPath WindowsSalaryApp-win-x64.zip
          gh release create "windows-build-${{ github.run_number }}" WindowsSalaryApp-win-x64.zip --title "الرواتب لويندوز - نسخة تجريبية ${{ github.run_number }}" --notes "Windows 11 x64؛ نسخة تجريبية للقراءة فقط من النسخة الاحتياطية. لم يتم اختبار الواجهة على جهاز المستخدم." --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
