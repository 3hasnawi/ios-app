name: Build Windows app
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: microsoft/setup-msbuild@v2
      - name: Test core with fictional data
        shell: pwsh
        run: dotnet run --project WindowsApp.Tests/WindowsApp.Tests.csproj --configuration Release
      - name: Publish unpackaged x64 app
        shell: pwsh
        working-directory: WindowsApp
        run: |
          msbuild SalaryWindows.csproj -restore -t:Publish -p:Configuration=Release -p:Version=1.0.${{ github.run_number }} -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:SelfContained=true -p:WindowsAppSDKSelfContained=true -p:WindowsPackageType=None "-p:PublishDir=$env:RUNNER_TEMP\SalaryWindows/"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "$env:RUNNER_TEMP\SalaryWindows\SalaryWindows.exe")) { throw 'Windows executable was not produced.' }
          $pri = 'bin\x64\Release\net8.0-windows10.0.19041.0\win-x64\SalaryWindows.pri'
          if (!(Test-Path $pri)) { throw 'The application resource index was not produced.' }
          Copy-Item $pri "$env:RUNNER_TEMP\SalaryWindows\SalaryWindows.pri" -Force
          if (!(Test-Path "$env:RUNNER_TEMP\SalaryWindows\Resources\Cairo.ttf")) { throw 'Cairo font was not included.' }
      - name: Create single Windows executable
        shell: pwsh
        working-directory: WindowsApp
        run: |
          $payload = Join-Path $env:RUNNER_TEMP 'salary-payload.zip'
          Compress-Archive -Path "$env:RUNNER_TEMP\SalaryWindows\*" -DestinationPath $payload
          dotnet publish Launcher/SalaryLauncher.csproj -c Release -r win-x64 --self-contained true "-p:PayloadPath=$payload" "-p:PublishDir=$env:RUNNER_TEMP\SalaryLauncher/"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "$env:RUNNER_TEMP\SalaryLauncher\AlRawatib.exe")) { throw 'Single executable was not produced.' }
      - name: Check single executable launches and cleans up
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\SalaryLauncher\AlRawatib.exe"
          $env:SALARY_STARTUP_DIAGNOSTIC = "$env:RUNNER_TEMP\salary-startup.log"
          $env:SALARY_LAUNCHER_DIAGNOSTIC = "$env:RUNNER_TEMP\salary-launcher.log"
          $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          $child = $null
          try {
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) { throw "Launcher exited during startup (code $($process.ExitCode))." }
              if ((Test-Path $env:SALARY_STARTUP_DIAGNOSTIC) -and ((Get-Content $env:SALARY_STARTUP_DIAGNOSTIC -Raw) -match 'Root theme: Light')) { break }
            }
            if (Test-Path $env:SALARY_STARTUP_DIAGNOSTIC) { Get-Content $env:SALARY_STARTUP_DIAGNOSTIC }
            if (!(Test-Path $env:SALARY_STARTUP_DIAGNOSTIC) -or !((Get-Content $env:SALARY_STARTUP_DIAGNOSTIC -Raw) -match 'Window activated') -or !((Get-Content $env:SALARY_STARTUP_DIAGNOSTIC -Raw) -match 'Root theme: Light')) { throw 'App window did not launch with the readable theme.' }
            $childInfo = Get-CimInstance Win32_Process -Filter "ParentProcessId = $($process.Id)" | Where-Object { $_.Name -eq 'SalaryWindows.exe' } | Select-Object -First 1
            if (!$childInfo) { throw 'Application process was not found.' }
            $child = Get-Process -Id $childInfo.ProcessId
            if (!$child.CloseMainWindow()) { throw 'Application window could not close normally.' }
            if (!$process.WaitForExit(30000)) { throw 'Launcher did not exit after closing the application.' }
            if ($process.ExitCode -ne 0) { throw "Launcher failed with code $($process.ExitCode)." }
            $runtime = Get-Content $env:SALARY_LAUNCHER_DIAGNOSTIC -Raw
            if (Test-Path $runtime) { throw 'Temporary application files were not cleaned up.' }
          } finally {
            if ($child -and !$child.HasExited) { Stop-Process -Id $child.Id -Force -ErrorAction SilentlyContinue }
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Publish executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "windows-build-${{ github.run_number }}" "$env:RUNNER_TEMP\SalaryLauncher\AlRawatib.exe" --title "الرواتب لويندوز - نسخة تجريبية ${{ github.run_number }}" --notes "Windows 11 x64؛ شغّل ملف exe مباشرة. نسخة تجريبية للقراءة فقط من النسخة الاحتياطية، تحتاج مطابقة النتائج على جهازك." --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
